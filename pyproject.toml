[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "fraudwatch"
version = "0.1.0"
description = "Full-stack machine learning system for transaction fraud risk detection."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.34,<1.0",
    "pydantic-settings>=2.7,<3.0",
    "pandas>=2.2,<4.0",
    "numpy>=2.0,<3.0",
    "scikit-learn>=1.6,<2.0",
    "imbalanced-learn>=0.13,<1.0",
    "joblib>=1.4,<2.0",
    "sqlalchemy>=2.0,<3.0"
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28,<1.0",
    "pytest>=8.3,<10.0",
    "pytest-cov>=6.0,<8.0",
    "ruff>=0.9,<1.0"
]

[tool.setuptools.packages.find]
include = ["backend*", "ai*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
